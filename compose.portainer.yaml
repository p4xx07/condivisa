services:
  app:
    image: "${IMAGE:-ghcr.io/p4xx07/condivisa:v0.2.0}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?set the public HTTPS origin}"
      SETUP_KEY: "${SETUP_KEY:?set a long random setup key}"
      PORT: "3000"
      # SQLite database included in the app, stored in the persistent volume.
      DB_PATH: /data/condivisa.sqlite
      # Expense attachments (photos and PDFs), stored in the same volume.
      UPLOAD_DIR: /data/uploads
    volumes:
      # Keep the database and attachments when the container is recreated.
      - condivisa_data:/data
volumes:
  condivisa_data:
