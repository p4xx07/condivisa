services:
  app:
    image: "${IMAGE:-ghcr.io/p4xx07/condivisa:v0.2.0}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?set the public HTTPS origin}"
      SETUP_KEY: "${SETUP_KEY:?set a long random setup key}"
      PORT: "3000"
      # Database SQLite incluso nel container, salvato nel volume persistente.
      DB_PATH: /data/condivisa.sqlite
      # File allegati alle spese (foto e PDF), salvati nello stesso volume.
      UPLOAD_DIR: /data/uploads
    volumes:
      # Conserva database e allegati quando il container viene ricreato.
      - condivisa_data:/data
volumes:
  condivisa_data:
