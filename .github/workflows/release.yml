name: Release container
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:api
        env:
          NODE_ENV: test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          SETUP_KEY=ci-setup-key-long-and-private PUBLIC_ORIGIN=http://127.0.0.1:5173 DB_PATH="${{ runner.temp }}/condivisa-ci.sqlite" NODE_ENV=test npm run dev:api > "${{ runner.temp }}/condivisa-api.log" 2>&1 &
          npm run dev > "${{ runner.temp }}/condivisa-vite.log" 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:5173/api/health && break; sleep 1; done
          E2E_SETUP_KEY=ci-setup-key-long-and-private node e2e/smoke.mjs
      - name: Production container smoke
        run: |
          docker build -t condivisa:ci .
          docker run --rm -d --name condivisa-ci -p 127.0.0.1:13000:3000 -e PUBLIC_ORIGIN=https://spese.example.com -e SETUP_KEY=ci-setup-key-long-and-private condivisa:ci
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:13000/api/health && break; sleep 1; done
          node e2e/production.mjs
          docker stop condivisa-ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Condivisa PWA self-hosted per spese di gruppo e permessi
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
